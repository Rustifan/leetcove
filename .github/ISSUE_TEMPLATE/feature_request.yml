name: Feature request
description: Suggest an improvement to LeetCove.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the workflow or limitation you would like to address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
